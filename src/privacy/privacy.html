<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Meet Privacy</title>
  <link rel="stylesheet" href="../styles/base.css">
  <style>
    body { padding: 32px 20px 64px; }
    article { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px 28px; box-shadow: var(--shadow); }
    article h3 { font-size: 22px; margin-top: 0; }
    article h4 { font-size: 16px; margin: 22px 0 6px; }
    article p, article li { font-size: 14px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
    td, th { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: var(--surface-2); }
  </style>
  <script type="module" src="privacy.js"></script>
</head>
<body>
  <article class="md" id="content">Loading…</article>
</body>
</html>
