name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: smart-meet-extension
          path: dist/*.zip
          if-no-files-found: error
